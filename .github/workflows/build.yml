name: 🏗️ Build and Publish Package

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build_full:
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-15-intel
            target: x86_64-apple-darwin
            arch: x64
            build: npm run build:rust -- --target x86_64-apple-darwin
          - host: macos-14
            target: aarch64-apple-darwin
            arch: arm64
            build: npm run build:rust -- --target aarch64-apple-darwin
          - host: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            arch: x64
            build: npm run build:rust -- --target x86_64-unknown-linux-gnu
          - host: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            arch: arm64
            build: npm run build:rust -- --target aarch64-unknown-linux-gnu
          - host: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            arch: x64
            build: npm run build:rust -- --target x86_64-unknown-linux-musl
          - host: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            arch: arm64
            build: npm run build:rust -- --target aarch64-unknown-linux-musl
          - host: windows-2022
            target: x86_64-pc-windows-msvc
            arch: x64
            build: npm run build:rust -- --target x86_64-pc-windows-msvc
          

    name: Build - ${{ matrix.settings.target }}
    runs-on: ${{ matrix.settings.host }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          architecture: ${{ matrix.settings.arch }}
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
          shared-key: ${{ matrix.settings.target }}
          
      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ninja -y
          ninja --version

      - name: Setup NASM (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1

      - name: Verify NASM (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: nasm -v

      - name: Cache musl cross toolchain (x86_64-linux-musl)
        if: matrix.settings.target == 'x86_64-unknown-linux-musl'
        uses: actions/cache@v5
        with:
          path: |
            ~/musl-cross
          key: musl-cross-${{ runner.os }}-x86_64-11-20211120

      - name: Install musl cross toolchain (x86_64-linux-musl)
        if: matrix.settings.target == 'x86_64-unknown-linux-musl'
        run: |
          set -eux
          rustup target add x86_64-unknown-linux-musl

          TOOLCHAIN_URL="https://github.com/troglobit/misc/releases/download/11-20211120/x86_64-linux-musl-cross.tgz"
          TOOLCHAIN_DIR="$HOME/musl-cross/x86_64-linux-musl-cross"

          if [ ! -d "$TOOLCHAIN_DIR" ]; then
            mkdir -p "$HOME/musl-cross"
            curl -L "$TOOLCHAIN_URL" -o /tmp/x86_64-linux-musl-cross.tgz
            tar -xzf /tmp/x86_64-linux-musl-cross.tgz -C "$HOME/musl-cross"
          fi

          echo "$TOOLCHAIN_DIR/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: npm ci
      
      - name: Patch btls-sys on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cd rust
          
          cargo fetch

          # wreq 6.0.0-rc.29 swapped the TLS backend from boring2 to btls, so the
          # BoringSSL build script this patches now ships in btls-sys.
          FILE=$(find ~/.cargo/registry/src -name "main.rs" | grep "btls-sys" | grep "build")
          
          if [ -z "$FILE" ]; then
            echo "Error: Could not find btls-sys build/main.rs to patch"
            exit 1
          fi
          
          echo "Patching $FILE"

          # sed exits 0 when a pattern matches nothing, so an upstream rename would
          # silently produce an unpatched build. Verify each edit landed instead.
          patch_and_verify() {
            sed -i "$1" "$FILE"

            if ! grep -q -F -- "$2" "$FILE"; then
              echo "Error: patch did not apply, upstream build script likely changed: $2"
              exit 1
            fi
          }

          patch_and_verify \
            's/let bssl_dir = build_boringssl_or_get_prebuilt(config);/let bssl_dir = build_boringssl_or_get_prebuilt(config); if config.target.ends_with("-msvc") { println!("cargo:rustc-link-search=native={}\/lib", bssl_dir.display()); }/' \
            'build_boringssl_or_get_prebuilt(config); if config.target.ends_with("-msvc")'

          patch_and_verify \
            's/cfg.build_target("ssl").build();/\/\/ cfg.build_target("ssl").build();/' \
            '// cfg.build_target'

          patch_and_verify \
            's/cfg.build_target("crypto").build()/cfg.build_target("ALL_BUILD").build()/' \
            'cfg.build_target("ALL_BUILD").build()'

      - name: Build native module (x86_64 musl target)
        if: matrix.settings.target == 'x86_64-unknown-linux-musl'
        env:
          # Tell Cargo what we are targeting
          CARGO_BUILD_TARGET: x86_64-unknown-linux-musl

          # Tell rustc which linker to use for that target
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: x86_64-linux-musl-gcc

          # Point btls-sys / cc / cmake at the musl cross toolchain
          CC_x86_64_unknown_linux_musl: x86_64-linux-musl-gcc
          CXX_x86_64_unknown_linux_musl: x86_64-linux-musl-g++
          AR_x86_64_unknown_linux_musl: x86_64-linux-musl-ar
          RANLIB_x86_64_unknown_linux_musl: x86_64-linux-musl-ranlib

          # Optional: keep it static
          RUSTFLAGS: -C target-feature=-crt-static
        run: npm run build:rust

      - name: Build native module (aarch64 musl target)
        if: matrix.settings.target == 'aarch64-unknown-linux-musl'
        run: |
          docker run --rm \
            -v "$PWD:/app" \
            -w /app \
            node:20-alpine \
            sh -lc '
              set -eux
              apk add --no-cache rust cargo build-base python3 cmake git clang-dev
              npm ci --ignore-scripts
              npm run build:rust
            '

      - name: Build native module (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RUST_BACKTRACE: "1"
          CARGO_TERM_VERBOSE: "true"
          CMAKE_GENERATOR: "Visual Studio 17 2022"
          CARGO_BUILD_TARGET: x86_64-pc-windows-msvc
          CARGO_TARGET_DIR: rust/target
          DEBUG: "false"
          OPT_LEVEL: "3"
          CARGO_PROFILE_RELEASE_BUILD_OVERRIDE_OPT_LEVEL: 3
          CARGO_PROFILE_RELEASE_BUILD_OVERRIDE_DEBUG: "false"
        run: ${{ matrix.settings.build }}

      - name: Build native module (other non-musl targets)
        # Only macOS remains on the host runner. The linux-*-gnu targets are
        # built inside manylinux_2_28 containers below to pin a portable
        # glibc baseline (glibc 2.28). Building on the ubuntu-24.04 runner
        # (glibc 2.39) produces binaries that require GLIBC_2.33/2.34 and fail
        # to load on older glibc (e.g. 2.31 on CentOS/RHEL-family). See #182.
        if: runner.os == 'macOS'
        run: ${{ matrix.settings.build }}

      - name: Build native module (x86_64-gnu target, manylinux_2_28)
        if: matrix.settings.target == 'x86_64-unknown-linux-gnu'
        run: |
          docker run --rm \
            -v "$PWD:/app" \
            -w /app \
            quay.io/pypa/manylinux_2_28_x86_64 \
            sh -lc '
              set -eux
              # manylinux_2_28 ships gcc-toolset / cmake / perl / python3, enough
              # for BoringSSL (btls) to build with gcc. We avoid the EPEL repo
              # (EPEL 8 is EOL with flaky mirrors); clang-devel 17 is available
              # from AppStream and provides libclang.so + clang builtin headers
              # (incl. stddef.h) needed by bindgen (btls-sys FFI generation).
              dnf install -y --disablerepo=epel git make clang-devel
              export LIBCLANG_PATH=/usr/lib64
              # Rust toolchain (manylinux images do not ship Rust).
              curl --proto =https --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
              source "$HOME/.cargo/env"
              rustup target add x86_64-unknown-linux-gnu
              # Node.js is required by @napi-rs/cli (napi build).
              curl -fsSL https://nodejs.org/dist/v22.11.0/node-v22.11.0-linux-x64.tar.xz \
                | tar -xJ -C /usr/local --strip-components=1
              npm ci --ignore-scripts
              npm run build:rust -- --target x86_64-unknown-linux-gnu
            '

      - name: Build native module (aarch64-gnu target, manylinux_2_28)
        if: matrix.settings.target == 'aarch64-unknown-linux-gnu'
        run: |
          docker run --rm \
            -v "$PWD:/app" \
            -w /app \
            quay.io/pypa/manylinux_2_28_aarch64 \
            sh -lc '
              set -eux
              dnf install -y --disablerepo=epel git make clang-devel
              export LIBCLANG_PATH=/usr/lib64
              curl --proto =https --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
              source "$HOME/.cargo/env"
              rustup target add aarch64-unknown-linux-gnu
              curl -fsSL https://nodejs.org/dist/v22.11.0/node-v22.11.0-linux-arm64.tar.xz \
                | tar -xJ -C /usr/local --strip-components=1
              npm ci --ignore-scripts
              npm run build:rust -- --target aarch64-unknown-linux-gnu
            '

      - name: Smoke test native addon
        if: runner.os == 'macOS'
        env:
          WREQ_TARGET: ${{ matrix.settings.target }}
        run: node scripts/smoke-native.cjs

      - name: Smoke test native addon (x86_64-gnu, manylinux_2_28)
        if: matrix.settings.target == 'x86_64-unknown-linux-gnu'
        run: |
          docker run --rm \
            -e WREQ_PLATFORM_ARCH=linux-x64-gnu \
            -v "$PWD:/app" \
            -w /app \
            quay.io/pypa/manylinux_2_28_x86_64 \
            sh -lc '
              curl -fsSL https://nodejs.org/dist/v22.11.0/node-v22.11.0-linux-x64.tar.xz \
                | tar -xJ -C /usr/local --strip-components=1
              node scripts/smoke-native.cjs
            '

      - name: Smoke test native addon (aarch64-gnu, manylinux_2_28)
        if: matrix.settings.target == 'aarch64-unknown-linux-gnu'
        run: |
          docker run --rm \
            -e WREQ_PLATFORM_ARCH=linux-arm64-gnu \
            -v "$PWD:/app" \
            -w /app \
            quay.io/pypa/manylinux_2_28_aarch64 \
            sh -lc '
              curl -fsSL https://nodejs.org/dist/v22.11.0/node-v22.11.0-linux-arm64.tar.xz \
                | tar -xJ -C /usr/local --strip-components=1
              node scripts/smoke-native.cjs
            '

      - name: Smoke test native addon (musl)
        if: matrix.settings.target == 'x86_64-unknown-linux-musl'
        run: |
          docker run --rm \
            -e WREQ_PLATFORM_ARCH=linux-x64-musl \
            -v "$PWD:/app" \
            -w /app \
            node:20-alpine \
            node scripts/smoke-native.cjs

      - name: Smoke test native addon (arm64 musl)
        if: matrix.settings.target == 'aarch64-unknown-linux-musl'
        run: |
          docker run --rm \
            -e WREQ_PLATFORM_ARCH=linux-arm64-musl \
            -v "$PWD:/app" \
            -w /app \
            node:20-alpine \
            node scripts/smoke-native.cjs

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: bindings-${{ matrix.settings.target }}
          path: rust/*.node
          if-no-files-found: error

  publish:
    name: Publish Package
    runs-on: ubuntu-24.04
    needs: build_full
    if: github.event_name == 'release'
    permissions:
      contents: read
      id-token: write  # Required for OIDC trusted publishing

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Ensure npm 11.5.1+ for trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Move artifacts to rust directory
        shell: bash
        run: |
          mkdir -p rust
          # Copy all .node files from artifacts to rust/
          find artifacts -name "*.node" -exec cp {} rust/ \;
          echo "Collected binaries:"
          ls -la rust/*.node

      - name: Copy artifacts to platform packages
        run: |
          cp rust/wreq-js.darwin-x64.node npm/wreq-js-darwin-x64/
          cp rust/wreq-js.darwin-arm64.node npm/wreq-js-darwin-arm64/
          cp rust/wreq-js.linux-x64-gnu.node npm/wreq-js-linux-x64-gnu/
          cp rust/wreq-js.linux-arm64-gnu.node npm/wreq-js-linux-arm64-gnu/
          cp rust/wreq-js.linux-x64-musl.node npm/wreq-js-linux-x64-musl/
          cp rust/wreq-js.linux-arm64-musl.node npm/wreq-js-linux-arm64-musl/
          cp rust/wreq-js.win32-x64-msvc.node npm/wreq-js-win32-x64-msvc/

      - name: Build TypeScript
        run: npm run build:ts

      - name: Publish platform packages with trusted publishing
        run: |
          npm publish ./npm/wreq-js-darwin-x64 --provenance --access public
          npm publish ./npm/wreq-js-darwin-arm64 --provenance --access public
          npm publish ./npm/wreq-js-linux-x64-gnu --provenance --access public
          npm publish ./npm/wreq-js-linux-arm64-gnu --provenance --access public
          npm publish ./npm/wreq-js-linux-x64-musl --provenance --access public
          npm publish ./npm/wreq-js-linux-arm64-musl --provenance --access public
          npm publish ./npm/wreq-js-win32-x64-msvc --provenance --access public

      - name: Publish to npm with trusted publishing
        run: npm publish --provenance --access public
