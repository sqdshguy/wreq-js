[package]
name = "wreq-js"
version = "3.0.0"
edition = "2024"
license = "MIT"
authors = ["Oleksandr Herasymov", "will-work-for-meal"]

[lib]
crate-type = ["cdylib"]

[dependencies]
# HTTP client with browser impersonation
wreq = { version = "6.0.0-rc.29", default-features = false, features = ["cookies", "gzip", "brotli", "deflate", "zstd", "charset", "system-proxy", "socks", "ws", "stream", "webpki-roots", "tokio-rt"] }
wreq-util = { version = "3.0.0-rc.14", features = ["emulation-serde", "tokio-rt", "emulation-compression"] }
webpki-root-certs = "1.0.8"

# WebSocket support
futures-util = "0.3.33"

# Byte buffers for streaming bodies
bytes = "1.12.1"

# Neon for Node.js bindings
neon = { version = "1.1.1", default-features = false, features = ["napi-6"] }

# Concurrent maps
dashmap = "6.2.1"

# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# Error handling
anyhow = "1.0.104"

# Async runtime
tokio = { version = "1.53.1", features = ["rt-multi-thread", "sync", "macros"] }
tokio-util = "0.7.18"

# Global state management
moka = { version = "0.12.15", features = ["sync"] }
uuid = { version = "1.23.4", features = ["v4"] }

[build-dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
wreq-util = { version = "3.0.0-rc.14", features = ["emulation-serde", "tokio-rt", "emulation-compression"] }

[dev-dependencies]
btls = "0.5.6"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = false
